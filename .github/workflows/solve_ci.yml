name: Solve CI Connectivity & Terraform

on: [push]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    
    services:
      mysql_test:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password_ci
          MYSQL_DATABASE: ecommerce_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python_version: '3.9'

      - name: Install Dependencies
        run: |
          pip install pandas sqlalchemy pymysql faker

      - name: Run Data Generation Test
        env:
          MYSQL_ROOT_PASSWORD: root_password_ci
          MYSQL_DB_NAME: ecommerce_db
          MYSQL_USER: root
          DB_HOST: 127.0.0.1
          MYSQL_HOST: 127.0.0.1
        run: |
          sed -i 's/DB_HOST = "mysql"/DB_HOST = os.getenv("DB_HOST", "127.0.0.1")/g' scripts/populate_data.py
          python scripts/populate_data.py

      # --- الجزء الجديد الخاص بـ Terraform ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init & Plan
        env:
          # هنا يقرأ السيرفر المفاتيح التي وضعتها أنت في الخزنة
          TF_VAR_snowflake_account: ${{ secrets.TF_VAR_snowflake_account }}
          TF_VAR_snowflake_user: ${{ secrets.TF_VAR_snowflake_user }}
          TF_VAR_snowflake_password: ${{ secrets.TF_VAR_snowflake_password }}
        run: |
          cd terraform
          terraform init
          terraform plan
      - name: Test Snowflake Connection
        env:
          TF_VAR_snowflake_account: ${{ secrets.TF_VAR_snowflake_account }}
          TF_VAR_snowflake_user: ${{ secrets.TF_VAR_snowflake_user }}
          TF_VAR_snowflake_password: ${{ secrets.TF_VAR_snowflake_password }}
        run: |
          pip install snowflake-connector-python
          python scripts/test_snowflake.py
      - name: Load Customers to Snowflake
        env:
          TF_VAR_snowflake_account: ${{ secrets.TF_VAR_snowflake_account }}
          TF_VAR_snowflake_user: ${{ secrets.TF_VAR_snowflake_user }}
          TF_VAR_snowflake_password: ${{ secrets.TF_VAR_snowflake_password }}
        run: |
          pip install pymysql pandas snowflake-connector-python
          python scripts/load_customers.py
      - name: Install and Execute dbt
        env:
          SF_ACCOUNT: ${{ secrets.TF_VAR_snowflake_account }}
          SF_USER: ${{ secrets.TF_VAR_snowflake_user }}
          SF_PASSWORD: ${{ secrets.TF_VAR_snowflake_password }}
        working-directory: ./dbt_ecommerce
        run: |
          # 1. تثبيت dbt والتأكد من تحديث pip
          python -m pip install --upgrade pip
          pip install dbt-snowflake
          
          # 2. إنشاء مجلد الـ profiles (الذي اتفقنا أنه Ignored في مستودعك)
          mkdir -p /home/runner/.dbt
          cat <<EOF > /home/runner/.dbt/profiles.yml
          ecommerce_project:
            outputs:
              dev:
                type: snowflake
                account: "$SF_ACCOUNT"
                user: "$SF_USER"
                password: "$SF_PASSWORD"
                role: 'ACCOUNTADMIN'
                warehouse: 'ECOMMERCE_COMPUTE_WH'
                database: 'ECOMMERCE_RAW_DB'
                schema: LANDING_ZONE
                threads: 1
            target: dev
          EOF
          
          # 3. التشغيل باستخدام 'python -m dbt' لضمان الوصول للمكتبة المثبتة
          python -m dbt debug
          python -m dbt run
          python -m dbt test
          dbt test

