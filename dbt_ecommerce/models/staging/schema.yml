version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: base_price
        tests:
          - not_null

  - name: stg_sales
    columns:
      - name: sale_id
        tests:
          - not_null
          - unique