version: '3.8'

services:
  # 1. مصدر البيانات الخام (MySQL)
  mysql:
    image: mysql:8.0
    container_name: mysql_ecommerce
    env_file: .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DB_NAME}
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data_network

 
  postgres_dw: 
    image: postgres:13
    container_name: postgres_dw  
    env_file: .env
    environment:
      - POSTGRES_USER=${PG_DW_USER}
      - POSTGRES_PASSWORD=${PG_DW_PASS}
      - POSTGRES_DB=${PG_DW_DB}
    ports:
      - "${PG_DW_EXTERNAL_PORT:-5438}:5432"
    volumes:
      - ./scripts/init_dw.sql:/docker-entrypoint-initdb.d/init_dw.sql
    networks:
      - data_network

  # 3. قاعدة بيانات Airflow الداخلية (Metadata)
  postgres_airflow:
    image: postgres:13
    container_name: airflow_postgres
    env_file: .env
    environment:
      - POSTGRES_USER=${AIRFLOW_DB_USER:-airflow}
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASS:-airflow}
      - POSTGRES_DB=${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    networks:
      - data_network

  # 4. محرك Airflow (Webserver)
  airflow-webserver:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    container_name: airflow_webserver
    restart: always
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW_DB_CONN}
      - AIRFLOW_CONN_MYSQL_DEFAULT=${AIRFLOW_CONN_MYSQL_DEFAULT}
      - AIRFLOW_CONN_SNOWFLAKE_DEFAULT=${AIRFLOW_CONN_SNOWFLAKE_DEFAULT}
      - AIRFLOW_CONN_POSTGRES_DW=postgres://${PG_DW_USER}:${PG_DW_PASS}@postgres_dw:5432/${PG_DW_DB}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./dbt_ecommerce:/opt/airflow/dbt_ecommerce
      - ./scripts:/opt/airflow/scripts
    depends_on:
      - postgres_airflow
      - postgres_dw
    networks:
      - data_network
    entrypoint: >
      bash -c "airflow db init && 
      airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin || true &&
      airflow webserver"

  # 5. المجدول (Scheduler)
  airflow-scheduler:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    container_name: airflow_scheduler
    restart: always
    env_file: .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW_DB_CONN}
      - AIRFLOW_CONN_MYSQL_DEFAULT=${AIRFLOW_CONN_MYSQL_DEFAULT}
      - AIRFLOW_CONN_SNOWFLAKE_DEFAULT=${AIRFLOW_CONN_SNOWFLAKE_DEFAULT}
      - AIRFLOW_CONN_POSTGRES_DW=postgres://${PG_DW_USER}:${PG_DW_PASS}@postgres_dw:5432/${PG_DW_DB}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./dbt_ecommerce:/opt/airflow/dbt_ecommerce
      - ./scripts:/opt/airflow/scripts
    depends_on:
      - postgres_airflow
      - postgres_dw
    networks:
      - data_network
    command: scheduler

networks:
  data_network:
    driver: bridge

volumes:
  mysql_data:
  postgres_airflow_data: